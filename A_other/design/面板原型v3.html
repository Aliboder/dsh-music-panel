  /* ============================================================
     actions
     ============================================================ */
  function handleAction(element, event) {
    var act = element.getAttribute('data-act');
    if (act !== 'menu' && act !== 'source-menu' && act !== 'account-menu' && act !== 'sort-menu' && act !== 'select-menu' && S.menu) {
      closeMenu();
    }
    if (act === 'menu') { handleMenuAction(element); return; }
    if (act === 'source-menu') { openSourceMenu(); return; }
    if (act === 'account-menu') { openAccountMenu(); return; }
    if (act === 'sort-menu') { openSortMenu(element); return; }
    if (act === 'select-menu') { openSelectMenu(element); return; }
    if (act === 'tab') {
      var page = element.getAttribute('data-page');
      navigate(page, null, { root: true });
      return;
    }
    if (act === 'back') { back(); return; }
    if (act === 'play-all') {
      var list = playListForPage();
      if (!list.length) { toast('这里还没有歌'); return; }
      playFrom(list, 0);
      return;
    }
    if (act === 'shuffle') {
      var shuffleList = playListForPage();
      if (!shuffleList.length) { toast('这里还没有歌'); return; }
      S.order = 'random';
      playFrom(shuffleList, Math.floor(Math.random() * shuffleList.length));
      renderPlayer();
      toast('随机播放');
      return;
    }
    if (act === 'view-toggle') {
      S.view = S.view === 'grid' ? 'list' : 'grid';
      renderContent();
      renderViewbar();
      return;
    }
    if (act === 'clear-selection') { clearSelection(); return; }
    if (act === 'fav') {
      var favTrack = trackById(element.getAttribute('data-id'));
      if (favTrack) toggleFav(favTrack);
      return;
    }
    if (act === 'fav-current') {
      var currentFavorite = currentTrack();
      if (currentFavorite) toggleFav(currentFavorite);
      return;
    }
    if (act === 'more') {
      var moreId = element.getAttribute('data-id');
      var rect = element.getBoundingClientRect();
      openRowMenu(moreId, rect.right - 220, rect.bottom + 4);
      return;
    }
    if (act === 'artist') {
      openArtist(element.getAttribute('data-name'));
      return;
    }
    if (act === 'album') {
      openAlbum(element.getAttribute('data-key'));
      return;
    }
    if (act === 'open-album') { openAlbum(element.getAttribute('data-key')); return; }
    if (act === 'open-artist') { openArtist(element.getAttribute('data-name')); return; }
    if (act === 'open-playlist') { openPlaylist(element.getAttribute('data-id')); return; }
    if (act === 'open-folder') { openFolder(element.getAttribute('data-folder')); return; }
    if (act === 'play-track') { playById(element.getAttribute('data-id')); return; }
    if (act === 'new-playlist') { newPlaylist(); return; }
    if (act === 'delete-playlist') { deletePlaylist(element.getAttribute('data-id')); return; }
    if (act === 'playlist-menu') { openPlaylistMenu(element.getAttribute('data-id'), element); return; }
    if (act === 'toggle') { togglePlay(); return; }
    if (act === 'prev') { step(-1, false); return; }
    if (act === 'next') { step(1, false); return; }
    if (act === 'shuffle-mode') { toggleOrder(); return; }
    if (act === 'loop') { cycleLoop(); return; }
    if (act === 'queue') {
      S.queueOpen = !S.queueOpen;
      $('#app').classList.toggle('queue-open', S.queueOpen);
      renderQueue();
      renderPlayer();
      return;
    }
    if (act === 'close-queue') {
      S.queueOpen = false;
      $('#app').classList.remove('queue-open');
      renderQueue();
      renderPlayer();
      return;
    }
    if (act === 'queue-play') {
      var index = Number(element.getAttribute('data-index')) || 0;
      var tracks = queueTracks();
      if (tracks[index]) playFrom(tracks, index);
      return;
    }
    if (act === 'locate') { locateCurrent(); return; }
    if (act === 'mute') { toggleMute(); return; }
    if (act === 'expand' || act === 'open-np') { toast('播放页保持原样，本 demo 不包含'); return; }
    if (act === 'seek') { seekTo(element, event.clientX); return; }
    if (act === 'login') { login(S.source); return; }
    if (act === 'navidrome-settings') { toast('设置 → 在线：填写服务器地址和账号（demo 不包含）'); return; }
    if (act === 'clear-folder') { S.folderFilter = ''; renderAll(); return; }
    if (act === 'clear-search') { clearSearch(); return; }
    if (act === 'go-songs') { navigate('songs', null, { root: true }); return; }
    if (act === 'add-folder') { toast('设置 → 音乐库：添加文件夹（demo 不包含）'); return; }
    if (act === 'refresh') { refresh(); return; }
    if (act === 'theme') { toggleTheme(); return; }
    if (act === 'layout') { toggleLayout(); return; }
    if (act === 'retry') { renderAll(); return; }
  }

  /* ============================================================
     account / theme / layout / refresh
     ============================================================ */
  function login(source) {
    var meta = SOURCES[source];
    if (!meta) return;
    if (source === 'navidrome') {
      toast('设置 → 在线：填写服务器地址和账号（demo 不包含）');
      return;
    }
    meta.loggedIn = true;
    meta.user = meta.user || '阿泽';
    if (meta.vip === undefined) meta.vip = true;
    renderAll();
    toast('已模拟登录 ' + meta.short);
  }
  function logout(source) {
    var meta = SOURCES[source];
    if (!meta) return;
    if (source === 'navidrome') { toast('Navidrome 在设置里断开连接（demo 不包含）'); return; }
    meta.loggedIn = false;
    meta.user = '';
    renderAll();
    toast('已退出 ' + meta.short);
  }
  function toggleTheme() {
    S.theme = S.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = S.theme;
    updateTopbar();
    toast(S.theme === 'dark' ? '深色模式' : '浅色模式');
  }
  function toggleLayout() {
    S.layout = S.layout === 'top' ? 'rail' : 'top';
    $('#app').dataset.layout = S.layout;
    renderViewbar();
    renderRail();
    updateTopbar();
    if (window.innerWidth < 1000) toast('窄窗口自动使用顶部标签');
    else toast(S.layout === 'rail' ? '侧栏布局' : '顶部布局');
  }
  function refresh() {
    var button = $('#refreshBtn');
    button.classList.add('is-spin');
    window.setTimeout(function () { button.classList.remove('is-spin'); }, 700);
    if (S.source === 'local') {
      toast('正在重新扫描曲库…');
      window.setTimeout(function () { toast('扫描完成（演示）'); }, 700);
    } else {
      toast('正在刷新 ' + sourceName(S.source));
      showLoading(600);
    }
  }

  /* ============================================================
     toast
     ============================================================ */
  function toast(message) {
    var el = $('#toast');
    el.textContent = message;
    el.classList.add('is-on');
    window.clearTimeout(S.toastTimer);
    S.toastTimer = window.setTimeout(function () { el.classList.remove('is-on'); }, 2000);
  }

  /* ============================================================
     events
     ============================================================ */
  function bindEvents() {
    document.addEventListener('click', function (event) {
      if (document.body.classList.contains('search-open') && !event.target.closest('.search') && !event.target.closest('#searchToggle')) {
        document.body.classList.remove('search-open');
      }
      var action = event.target.closest('[data-act]');
      if (action) {
        event.preventDefault();
        handleAction(action, event);
        return;
      }
      if (S.menu && !event.target.closest('.menu')) closeMenu();
      var row = event.target.closest('.row');
      if (row && event.detail <= 1) {
        var id = row.getAttribute('data-id');
        selectRow(id, event.metaKey || event.ctrlKey);
      }
    });

    document.addEventListener('dblclick', function (event) {
      var row = event.target.closest('.row');
      if (!row || event.target.closest('button')) return;
      playById(row.getAttribute('data-id'));
    });

    document.addEventListener('contextmenu', function (event) {
      var row = event.target.closest('.row');
      if (row) {
        event.preventDefault();
        openRowMenu(row.getAttribute('data-id'), event.clientX, event.clientY);
        return;
      }
      var playlistCard = event.target.closest('[data-act="open-playlist"]');
      if (playlistCard) {
        event.preventDefault();
        openPlaylistMenu(playlistCard.getAttribute('data-id'), playlistCard);
      }
    });

    document.addEventListener('input', function (event) {
      if (event.target.id === 'vol') {
        S.volume = Number(event.target.value) / 100;
        S.muted = false;
        updateVolumeIcon();
      }
    });

    document.addEventListener('keydown', function (event) {
      var tag = event.target && event.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') {
        if (event.key === 'Escape') {
          if (document.body.classList.contains('search-open')) {
            document.body.classList.remove('search-open');
            return;
          }
          if (S.query) { clearSearch(); return; }
          event.target.blur();
        }
        return;
      }
      if (event.key === 'Escape') {
        if (handleEscape()) event.preventDefault();
        return;
      }
      if (event.key === '/' && !event.metaKey && !event.ctrlKey) {
        event.preventDefault();
        if (window.innerWidth < 760) document.body.classList.add('search-open');
        $('#q').focus();
        return;
      }
      if (event.code === 'Space') {
        if (event.target.closest('button')) return;
        event.preventDefault();
        togglePlay();
        return;
      }
      if ((event.metaKey || event.ctrlKey) && event.key === 'ArrowRight') {
        event.preventDefault();
        step(1, false);
        return;
      }
      if ((event.metaKey || event.ctrlKey) && event.key === 'ArrowLeft') {
        event.preventDefault();
        step(-1, false);
        return;
      }
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp' || event.key === 'Home' || event.key === 'End') {
        var rows = $$('.row', $('#content'));
        if (!rows.length) return;
        var active = document.activeElement && document.activeElement.closest ? document.activeElement.closest('.row') : null;
        var currentIndex = -1;
        rows.forEach(function (row, index) {
          if (active === row || row.getAttribute('data-id') === S.focusId) currentIndex = index;
        });
        if (currentIndex < 0) currentIndex = 0;
        if (event.key === 'ArrowDown') currentIndex = Math.min(rows.length - 1, currentIndex + 1);
        else if (event.key === 'ArrowUp') currentIndex = Math.max(0, currentIndex - 1);
        else if (event.key === 'Home') currentIndex = 0;
        else if (event.key === 'End') currentIndex = rows.length - 1;
        event.preventDefault();
        var nextRow = rows[currentIndex];
        S.focusId = nextRow.getAttribute('data-id');
        renderContent();
        S.focusId = nextRow.getAttribute('data-id');
        window.requestAnimationFrame(function () {
          var target = document.querySelector('.row[data-id="' + S.focusId + '"]');
          if (target) target.focus({ preventScroll: true });
          if (target) target.scrollIntoView({ block: 'nearest' });
        });
        return;
      }
      if (event.key === 'Enter') {
        var focusedRow = document.activeElement && document.activeElement.closest ? document.activeElement.closest('.row') : null;
        if (focusedRow) {
          event.preventDefault();
          playById(focusedRow.getAttribute('data-id'));
        }
      }
    });

    var seeking = false;
    document.addEventListener('pointerdown', function (event) {
      var progress = event.target.closest('.pb-progress');
      if (!progress) return;
      seeking = true;
      seekTo(progress, event.clientX);
      event.preventDefault();
    });
    document.addEventListener('pointermove', function (event) {
      if (!seeking) return;
      var progress = $('.pb-progress');
      if (progress) seekTo(progress, event.clientX);
    });
    document.addEventListener('pointerup', function () { seeking = false; });

    $('#player').addEventListener('click', function (event) {
      if (event.target.closest('[data-act]') || event.target.closest('input')) return;
      toast('播放页保持原样，本 demo 不包含');
    });
  }

  function handleEscape() {
    if (S.menu) { closeMenu(); return true; }
    if (document.body.classList.contains('search-open')) {
      document.body.classList.remove('search-open');
      return true;
    }
    if (S.rangePick) {
      S.rangePick = false;
      S.rangeAnchor = '';
      toast('已取消区域选择');
      return true;
    }
    if (S.selection.size) { clearSelection(); return true; }
    if (S.page === 'search' && S.query) { clearSearch(); return true; }
    if (S.history.length || detailPage()) { back(); return true; }
    if (S.queueOpen) {
      S.queueOpen = false;
      $('#app').classList.remove('queue-open');
      renderQueue();
      renderPlayer();
      return true;
    }
    if (S.query) { S.query = ''; renderAll(); return true; }
    return false;
  }

  /* ============================================================
     hash / init
     ============================================================ */
  function applyHash() {
    var raw = String(location.hash || '').replace(/^#/, '');
    if (!raw) return;
    try { raw = decodeURIComponent(raw); } catch (error) { /* keep raw */ }
    var parts = raw.split('&');
    var source = '';
    var page = '';
    var param = '';
    var query = null;
    var menu = '';
    var theme = '';
    var layout = '';
    var queue = false;
    parts.forEach(function (part) {
      var at = part.indexOf('=');
      var key = at < 0 ? part : part.slice(0, at);
      var value = at < 0 ? '' : part.slice(at + 1);
      if (key === 'light') theme = 'light';
      else if (key === 'rail') layout = 'rail';
      else if (key === 'queue') queue = true;
      else if (key === 'source') source = value;
      else if (key === 'page') page = value;
      else if (key === 'album') { page = 'album'; param = value; }
      else if (key === 'artist') { page = 'artist'; param = value; }
      else if (key === 'playlist') { page = 'playlist'; param = value; }
      else if (key === 'search') { page = 'search'; query = value; }
      else if (key === 'menu') menu = value;
    });
    if (source && SOURCES[source]) S.source = source;
    if (theme) S.theme = theme;
    if (layout) S.layout = layout;
    S.queueOpen = queue;
    if (query !== null) S.query = query;
    if (page) { S.page = page; S.param = param || null; }
    else { S.page = defaultPage(S.source); S.param = null; }
    var tabs = tabsFor(S.source);
    if (['album', 'artist', 'playlist', 'search'].indexOf(S.page) < 0 && tabs.indexOf(S.page) < 0) {
      S.page = defaultPage(S.source);
      S.param = null;
    }
    S._hashMenu = menu;
    document.documentElement.dataset.theme = S.theme;
    $('#app').dataset.layout = S.layout;
  }

  function init() {
    hydrateIcons(document);
    initTopbar();
    applyHash();
    ensureSort();
    renderAll();
    bindEvents();
    if (S._hashMenu === 'source') openSourceMenu();
    window.setInterval(function () {
      if (!S.playing) return;
      var track = currentTrack();
      if (!track) return;
      var duration = track.dur || 0;
      if (duration <= 0) return;
      S.progress += 1;
      if (S.progress >= duration) {
        S.progress = duration;
        onTrackEnd();
        return;
      }
      updateProgressUi();
    }, 1000);
    document.body.dataset.ready = '1';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
